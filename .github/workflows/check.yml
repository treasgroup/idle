# On every push and pull request: types, the engine tests on the real catalog, and PHP syntax of the server.
name: check

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php --version
          find server -name '*.php' -not -path 'server/_mockup/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Catalog files are valid JSON
        run: for f in server/data/catalog/*.json; do php -r 'json_decode(file_get_contents($argv[1]), false, 512, JSON_THROW_ON_ERROR);' "$f" || exit 1; done
