<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Как идут дела — Что приготовить?</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <style>
    :root { --paper:#faf7f0; --card:#fff; --line:#e8e1d5; --ink:#211d1a; --soft:#5c544d; --brand:#b7432f; --herb:#36703f; --warn:#8f5208; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
    a { color: var(--brand); }
    h1 { font-size: 28px; margin: 8px 0 4px; font-weight: 600; }
    h2 { font-size: 20px; margin: 32px 0 10px; font-weight: 600; }
    .muted { color: var(--soft); font-size: 14px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
    .row { display:flex; align-items:center; gap:12px; padding:8px 0; border-top:1px solid var(--line); }
    .row:first-child { border-top:0; }
    .bar { height: 10px; border-radius: 99px; background: #f2ece2; flex: 1; overflow: hidden; }
    .bar > span { display:block; height:100%; background: var(--brand); border-radius: 99px; }
    .num { min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
    .label { min-width: 190px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .big { font-size: 32px; font-weight: 600; }
    .err { font-family: ui-monospace, Menlo, monospace; font-size: 13px; word-break: break-word; }
    select, button { font: inherit; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); }
    .top { display:flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .empty { color: var(--soft); padding: 8px 0; }
  </style>
</head>
<body>
  <main>
    <p><a href="./">← Админ-панель</a></p>
    <div class="top">
      <div>
        <h1>Как идут дела</h1>
        <p class="muted">Что пишут люди, сколько доходят до готового блюда, кто возвращается, что сломалось и где копии базы.</p>
      </div>
      <label>За <select id="days"><option value="7">7 дней</option><option value="30" selected>30 дней</option><option value="90">90 дней</option></select></label>
    </div>
    <div id="out"><p class="muted">Загружаю…</p></div>
  </main>
  <script src="./insights.js"></script>
</body>
</html>
